<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy Value</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050505;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      padding: 24px 28px;
      max-width: 480px;
      width: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      color: #fafafa;
      letter-spacing: -0.2px;
    }

    .badge {
      background: rgba(34, 211, 238, 0.08);
      color: #22d3ee;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 12px;
      color: #71717a;
      font-weight: 400;
      margin-bottom: 16px;
    }

    .value-container {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .value-text {
      font-size: 13px;
      font-weight: 500;
      color: #a1a1aa;
      word-break: break-all;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      line-height: 1.5;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.08);
      color: #22d3ee;
      border: 1px solid rgba(34, 211, 238, 0.15);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .copy-btn:hover {
      background: rgba(34, 211, 238, 0.15);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #71717a;
    }

    .status-label {
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="title">Copy Value</span>
      <span class="badge">Clipboard</span>
    </div>
    <p class="subtitle">Value copied from Grafana dashboard</p>

    <div class="value-container">
      <span class="value-text" id="value"></span>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      <span class="status-label">You can close this tab if it didn't close automatically.</span>
    </div>
  </div>

 <script>
  const val = new URLSearchParams(location.search).get('v') || '';
  document.getElementById('value').textContent = val;

  const btn = document.getElementById('copyBtn');
  const dot = document.querySelector('.status-dot');
  const label = document.querySelector('.status-label');

  function copyValue(userGesture) {
    console.log('[copy] attempt', { userGesture, valueLength: val.length });

    if (!navigator.clipboard) {
      console.warn('[copy] navigator.clipboard not available — page may not be served over HTTPS');
    }

    navigator.clipboard.writeText(val).then(() => {
      console.log('[copy] navigator.clipboard.writeText() succeeded');
      onSuccess();
    }).catch((err) => {
      console.warn('[copy] navigator.clipboard.writeText() failed:', err.name, err.message);

      if (userGesture) {
        console.log('[copy] falling back to execCommand("copy") with user gesture');
        const ta = document.createElement('textarea');
        ta.value = val;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const result = document.execCommand('copy');
        document.body.removeChild(ta);
        console.log('[copy] execCommand("copy") returned:', result);
        onSuccess();
      } else {
        console.warn('[copy] auto-copy failed without user gesture — waiting for button click');
        onFailure();
      }
    });
  }

  function onSuccess() {
    console.log('[copy] success — closing tab in 500ms');
    btn.textContent = 'Copied!';
    btn.disabled = true;
    dot.style.background = '#22c55e';
    label.textContent = 'Copied. You can close this tab.';
    setTimeout(() => window.close(), 500);
  }

  function onFailure() {
    console.log('[copy] showing fallback UI — user must click button');
    dot.style.background = '#ef4444';
    label.textContent = 'Click the Copy button to copy.';
  }

  btn.onclick = () => copyValue(true);

  // attempt auto-copy — only closes if clipboard API actually succeeds
  copyValue(false);
</script>
</body>
</html>
